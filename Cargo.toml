[package]
name = "button-studio"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "button-studio"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
cosmic-text = "0.19.0"
csv = "1.4.0"
eframe = "0.35.0"
fontdb = "0.23.0"
iconflow = { version = "1.0.0", features = ["pack-lucide"] }
image = "0.25.10"
imageproc = "0.27.0"
printpdf = { version = "0.8.2", default-features = false }
qrcode = "0.14.1"
rfd = "0.17.2"
rmcp = { version = "3.0.1", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
	"std",
	"NSObject",
	"NSArray",
	"NSString",
	"NSURL",
	"NSAppleEventDescriptor",
	"NSAppleEventManager",
] }
